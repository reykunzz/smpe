name: Build SMPE APK
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log
      - name: Ringkasan error
        if: failure()
        run: grep -E "^e: |What went wrong|FAILURE|error:" -A4 build.log | head -120 || true
      - uses: actions/upload-artifact@v4
        with:
          name: SA-Mobile-Map-Editor-SMPE
          path: app/build/outputs/apk/release/*.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
